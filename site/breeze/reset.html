<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8">
<title>Reset password · Breeze</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E8;--paper:#FBF8F2;--ink:#14284B;--ink2:#4A5A78;--muted:#8A93A6;--line:rgba(20,40,75,.14);--danger:#B4423A;--ok:#2F7A54}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 22px 40px}
.wordmark{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;font-size:48px;line-height:1}
h1{font-size:20px;margin:18px 0 6px}
p{color:var(--ink2);margin:0 0 22px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
button{margin-top:24px;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px Inter,sans-serif;background:var(--ink);color:#fff}
button:disabled{opacity:.5}
.msg{margin-top:16px;font-size:15px;min-height:22px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="wordmark">Breeze</div>
  <h1>Reset your password</h1>
  <p>Use the reset code you set in Cloudflare. It works once.</p>
  <form id="f" autocomplete="on">
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Leave blank if you're not sure">
    <div class="hint">Blank works if you're the only admin. We'll show you the email.</div>
    <label for="code">Reset code</label>
    <input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6">
    <label for="pw2">New password again</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6">
    <button id="go" type="submit">Change password</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</main>
<script>
const API = 'https://breeze-worker.zakmedwin.workers.dev';
const $ = id => document.getElementById(id);
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  if ($('pw').value.length < 6) { msg.className = 'msg err'; msg.textContent = 'Use at least 6 characters.'; return; }
  if ($('pw').value !== $('pw2').value) { msg.className = 'msg err'; msg.textContent = 'The two passwords don’t match.'; return; }
  $('go').disabled = true;
  try {
    const res = await fetch(API + '/api/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('em').value.trim(), code: $('code').value.trim(), newPassword: $('pw').value }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 404 && data.error === 'Not found') throw new Error('The Breeze server doesn’t have the reset yet. Deploy the server update first.');
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    try { localStorage.setItem('breeze.lastEmail', data.email || ''); } catch {}
    $('f').querySelectorAll('input').forEach(i => i.disabled = true);
    msg.className = 'msg ok';
    msg.innerHTML = 'Password changed. Your Breeze email is <b></b>. <a href="./">Sign in now</a>';
    msg.querySelector('b').textContent = data.email || '';
    $('go').style.display = 'none';
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message === 'Failed to fetch' ? 'Couldn’t reach Breeze. Check your connection.' : err.message;
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
